[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# internal
gate-core = { path = "crates/gate-core" }
gate-jcs = { path = "crates/gate-jcs" }
gate-crypto = { path = "crates/gate-crypto" }
gate-span = { path = "crates/gate-span" }
gate-schema = { path = "crates/gate-schema" }
gate-policy = { path = "crates/gate-policy" }
gate-provenance = { path = "crates/gate-provenance" }
gate-ledger = { path = "crates/gate-ledger" }
gate-brief = { path = "crates/gate-brief" }
gate-tlog = { path = "crates/gate-tlog" }
gate-witness = { path = "crates/gate-witness" }
gate-transport = { path = "crates/gate-transport" }
gate-endorse-channel = { path = "crates/gate-endorse-channel" }
gate-testkit = { path = "crates/gate-testkit" }
mcp-gate = { path = "crates/mcp-gate" }
mcp-audit = { path = "crates/mcp-audit" }
nova-witness = { path = "crates/nova-witness" }
void-bench = { path = "crates/void-bench" }

# external (pure Rust; see deny.toml for the native-code ban)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
chacha20poly1305 = "0.10"
redb = "2"
regex = "1"
toml = "0.8"
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
