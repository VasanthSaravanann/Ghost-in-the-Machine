name: ci
on: [push, pull_request]

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      # FIPS profile: Ed25519 must be refused, P-256 + SHA-256 must still work.
      - run: cargo test -p gate-crypto --features fips
      - run: bash ci/scripts/r_grep.sh
      - run: bash ci/scripts/forbid_unsafe_check.sh
      - run: python3 ci/scripts/tcb_lang_check.py
      - run: cargo install cargo-deny cargo-audit --locked
      - run: cargo deny check
      - run: cargo audit

  integ:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --tests

  adv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Adversarial suites: every test named t_* is an attempt to violate an
      # invariant or a task acceptance criterion (§5.12).
      - run: cargo test --workspace -- t_
